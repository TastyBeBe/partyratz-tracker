<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Party Ratz launch tracker</title>
<meta name="description" content="Live progress of Party Ratz 4 Life towards its 23 November launch: what Albert has approved, what is left, and whether the schedule holds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 22l6-6 4 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Party Ratz 4 Life</div>
      <h1>Launch tracker</h1>
      <div class="ratbar" aria-hidden="true"><i style="background:var(--rat-red)"></i><i style="background:var(--rat-yellow)"></i><i style="background:var(--rat-blue)"></i><i style="background:var(--rat-green)"></i></div>
    </div>
    <div class="live" id="live" role="status" aria-live="polite"><span class="dot"></span><span id="live-text">Loading…</span></div>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div class="banner" id="banner"></div>

  <section class="grid hero-row">
    <div class="card hero" id="hero"></div>
    <div class="card"><div class="kpis" id="kpis"></div></div>
  </section>

  <section class="grid two">
    <div class="card" id="now"></div>
    <div class="card" id="recent"></div>
  </section>

  <section class="card" id="cats"></section>
  <section class="card" id="timeline"></section>
  <section class="card" id="burnup"></section>
  <section class="card" id="games"></section>
  <section class="card" id="all"></section>

  <footer id="foot"></footer>
</div>
<script src="assets/stats.js?v=5"></script>
<script src="assets/app.js?v=5"></script>
</body>
</html>
